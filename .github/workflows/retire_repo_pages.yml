name: Retire Repo Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire_repo_pages.yml"
      - "deprecated_pages/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: retire-repo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload retirement site
        uses: actions/upload-pages-artifact@v3
        with:
          path: deprecated_pages

      - name: Deploy retirement site
        id: deployment
        uses: actions/deploy-pages@v4
