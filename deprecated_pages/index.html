<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>INFTY Docs Moved</title>
    <meta http-equiv="refresh" content="0; url=https://infty-ai.github.io/doc/" />
    <link rel="canonical" href="https://infty-ai.github.io/doc/" />
    <script>
      window.location.replace("https://infty-ai.github.io/doc/");
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --card: #ffffff;
        --text: #182232;
        --muted: #5b687a;
        --accent: #0f62fe;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #e8eefc 0, var(--bg) 45%);
        color: var(--text);
      }
      main {
        max-width: 640px;
        margin: 10vh auto;
        padding: 32px;
      }
      .card {
        background: var(--card);
        border-radius: 18px;
        box-shadow: 0 18px 48px rgba(24, 34, 50, 0.08);
        padding: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.6;
        color: var(--muted);
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>INFTY docs moved</h1>
        <p>This GitHub Pages site has been retired.</p>
        <p>
          You are being redirected to the active documentation site:
          <a href="https://infty-ai.github.io/doc/">https://infty-ai.github.io/doc/</a>
        </p>
      </section>
    </main>
  </body>
</html>
